# Example service for the media VM's compose.yaml (/config/compose/compose.yaml).
# Before the first start: mkdir -p /config/salvarr && chown 1000:1000 /config/salvarr
services:
  salvarr:                                   # browse the .recycle folders, compare with the library
    image: ghcr.io/yannb2/salvarr:dev
    container_name: salvarr
    user: 1000:1000                          # media; only needs to read the files
    environment:
      TZ: America/Toronto
      # Radarr and Sonarr: time left before they empty a file, and a rescan after a restore.
      # Starting values: what is saved on the Settings page wins.
      Salvarr__Radarr__Url: http://radarr:7878
      Salvarr__Radarr__ApiKey: ${RADARR_API_KEY}
      Salvarr__Sonarr__Url: http://sonarr:8989
      Salvarr__Sonarr__ApiKey: ${SONARR_API_KEY}
      # Restore and delete. Off by default; turning it on also needs the :ro removed below.
      # Salvarr__AllowChanges: "true"
      # The defaults, shown here so they are easy to change:
      # Salvarr__Libraries__0__Name: Movies
      # Salvarr__Libraries__0__Path: /movies
      # Salvarr__Libraries__0__Kind: Movies
      # Salvarr__Libraries__1__Name: TV
      # Salvarr__Libraries__1__Path: /tv
      # Salvarr__Libraries__1__Kind: Series
      # Salvarr__RecycleFolderNames__0: .recycle
      # Salvarr__SearchDepth: "2"
    ports:
      - 8184:8184
    volumes:
      - /config/salvarr:/config              # what the Settings page saves (settings.json)
      - /movies:/movies:ro                   # read-only until AllowChanges is on
      - /tv:/tv:ro
    restart: unless-stopped
